[package]
name = "librarian-studio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "librarian_studio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
librarian-ingest = { path = "../librarian-ingest" }
librarian-llm-engine = { path = "../librarian-llm-engine" }
